<div class="container pt-5 pb-5">
  <h2 class="text-center mb-5">{{header}}</h2>
  <div class="text-center" *ngIf="nothingFound">Ничего не найдено</div>
  <div class="row row-cols-1 row-cols-sm-2 row-cols-md-3 g-3">
    <div class="col" *ngFor="let product of products">
      <div class="card">
        <img class="image-popup-vertical-fit" src="{{product.image}}"
             alt="Tea">
        <div class="card-body">
          <h5 class="card-title">{{product.title}}</h5>
          <p class="card-text text-truncate">{{product.description}}</p>
          <a [routerLink]="['/products', product.id]" class="btn btn-primary">Подробнее</a>
        </div>
      </div>
    </div>
    <div *ngIf="loader" class="loader-bg">
      <div class="loader"></div>
    </div>
  </div>
</div>
